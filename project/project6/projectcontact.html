<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projectstyles.css"/>
  <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico" />
  <title>Dylan Mills | Contact</title>
  <style>
    body {
      background-color: black;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .content_container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .image_container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .closeup {
      width: 110%;
      height: auto;
    }

    .form_container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 20px;
    }

    .text_connect {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 5em;
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold
    }
    .connect_caption {
        margin-left: 13%;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      width: 100%;
      color: white;
      margin: 0 auto;
    }

    .firstlast_containers {
      display: flex;
      gap: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ccc;
      box-sizing: border-box;
      opacity: 0.5;
    }

    input:focus, textarea:focus {
      box-shadow: 0 0 5px 2.5px rgb(255, 255, 255);
      outline: none;
    }

    input::placeholder, textarea::placeholder {
      color: #888;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    button {
      padding: 10px 20px;
      background-color: white;
      color: black;
      border: none;
      cursor: pointer;
    }

    button:hover {
      box-shadow: 0 0 10px 5px rgb(255, 255, 255);
    }

    .socials {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 25px;
    }

    footer {
      text-align: center;
      background-color: #000;
      color: #fff;
      width: 100%;
    }

    #hamicon {
      display: none;
    }

    #close {
      display: none;
    }

    #message {
        height: 150px;
    }

    @media only screen and (max-width: 800px) {
      #hamicon {
        display: block;
      }

      #close {
        display: block;
        margin: 0 auto;
        cursor: pointer;
        color: white;
      }

      a {
        display: block;
      }

      #navlinks {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: black;
        text-align: center;
        padding: 10px 0;
        position: absolute;
        top: 100%;
      }

      .nav_box {
        margin: 0 20px;
        margin-top: 20px;
      }

      body {
        background-position: center top;
      }

      main {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .content_container {
        flex-direction: column;
        align-items: center;
      }
      .text_connect{
        margin-top: 15px;
      }
      .image_container{
        width: 100%;
        padding: 0px;
      }
      .form_container {
        width: 100%;
        padding: 0px;
      }

      .closeup {
        width: 80%;
        margin: 0 auto;
      }

      .text_connect {
        font-size: 3em;
      }
    }
  </style>
</head>
<body>
  <div class="nav_box">
    <a class="nav_name" href="index.html">DYLAN MILLS</a>
    <img id="hamicon" onclick="showNav();" src="../images/whitemenu.png" alt="hamburger icon" />
    <nav id="navlinks">
      <a href="projectabout.html">ABOUT</a>
      <a href="projectgallery.html">GALLERY</a>
      <a href="index.html#resume_section">RESUME</a>
      <a href="projectnews.html">NEWS</a>
      <a href="projectcontact.html" class = "active" style = "opacity: 1">CONTACT</a>
    </nav>
  </div>

  <main>
    <div class="content_container">
      <div class="image_container">
        <img class="closeup" src="../images/dylanmillscloseupextended.jpg" alt="Dylan closeup headshot" />
      </div>
      <div class="form_container">
        <p class="text_connect">CONNECT</p>
        <form action="https://formspree.io/f/mnnjznqg" method="post">
        <div class = "connect_caption">
            <p>Reach out with performance opportunities or just to say hello!</p>
        </div>
          <div class="firstlast_containers">
            <input type="text" id="first-name" placeholder="First Name" required />
            <input type="text" id="last-name" placeholder="Last Name" required />
          </div>
          <input type="email" id="email" placeholder="Email" required />
          <input type="text" id="subject" placeholder="Subject" required />
          <textarea id="message" placeholder="Your Message"></textarea>
          <button type="submit"><strong>SUBMIT</strong></button>
        </form>
        <div class="socials">
          <a href="https://www.instagram.com/thekidthatflips/"><img src="../images/instagramlogo.png" alt="Instagram Logo" width="30" height="30" /></a>
          <a href="https://www.facebook.com/profile.php?id=100094337165685"><img src="../images/facebooklogo.png" alt="Facebook Logo" width="30" height="30" /></a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 - All Rights Reserved</p>
  </footer>

  <div id="sideNav">
    <span id="closeX" onclick="hideNav()">×</span>
    <a href="projectabout.html">ABOUT</a>
    <a href="projectgallery.html">GALLERY</a>
    <a href="index.html#resume_section">RESUME</a>
    <a href="projectnews.html">NEWS</a>
    <a href="projectcontact.html">CONTACT</a>
    </div>

    <script>
    function showNav() {
        document.getElementById("sideNav").style.width = "50%";
    }

    function hideNav() {
        document.getElementById("sideNav").style.width = "0";
    }
    </script>
</body>
</html>
