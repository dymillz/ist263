<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="projectstyles.css">
        <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico">

        <title>Dylan Mills | Contact</title>
    </head>
    <style>
         body {
            height: 100%;
            background-image: url("../images/dylanmillscloseupextendededited.jpg");
            height: 100vh;
            /*min-height: 100vh;*/
            background-size: cover;
            background-position: center;
            /*background-position-x: 60%, right;
            background-position-y: 1000, top;*/
            background-repeat: no-repeat;
         }
        nav {
                display: flex;
                border: white, 10px solid;
                margin-top: 30px;
                margin-right: 50px;
                margin-left: 50px;
                border-radius: 5px;
            }
        .navtext a:link {
            font-size: 4em;
            font-weight: bold;
            text-decoration: none;
            color: white;
            margin-left: 20px;
            margin-top: 30px;
        }
        .hamburger {
            position: absolute;
            right: 90px;
            margin-top: 30px;
            margin-bottom: 20px
        }
        main {
            flex: 1; /* Fills available space */
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Keep content starting at top */
            padding-bottom: 10%
        }
        .text_connect {
             margin-left: 10%;
             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 5em;
            margin-left: 40%;
            margin-top: 30px;
            margin-bottom: 30px
            }
        
        label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 10px; /*gap to place space between hte boxes*/
            max-width: 600px;
            text-align: left;
            margin-left:50%;
            color: white;
        }

        .firstlast_containers {
            display: flex;
            gap: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            box-sizing: border-box; /*keeps box at 100% including borders and padding */
            opacity: 0.5; /* 70% opacity */
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 5px 2.5px rgb(255, 255, 255);
            outline: none;
        }

        input::placeholder, textarea::placeholder {
            color: #888;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }

        button {
            padding: 10px 20px;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 10px 5px rgb(255, 255, 255);
        }   
        .socials {
            display: flex;
            margin-left: 67.5%;
            margin-top: 2%;
            gap: 25px;
        }
        footer {
            text-align: center;
            background-color: #000;
            color: #fff;
            margin-top: auto; 
            width: 100%;
        }
    </style>

    <body>
            <nav>
                <p class="navtext"><a href= "index.html">DYLAN MILLS</p></a>
                <div class = "hamburger"><a href="projectnavigation.html"><img src = "../images/squareham.png" alt="hamburgericon" width="100" height="60"></a>
                </div>
            </nav>
            <main>
                <p class = "text_connect glow">CONNECT</h1>
                <div class = "form">
                    <form action="https://formspree.io/f/mnnjznqg" method="post">
                        <div class="firstlast_containers">
                            <input type="text" id="first-name" placeholder="First Name" required>
                            <input type="text" id="last-name" placeholder="Last Name" required>
                        </div>
                        <input type="email" id="email" placeholder="Email" required>
                        <input type="text" id="subject" placeholder="Subject" required>
                        <textarea id="message" placeholder="Your Message" required height = "150"></textarea><!--placeholder puts label inside-->
                        <button type="submit"><strong>SUBMIT</strong></button>
                    </form>
                        
                </div>
                <div class = "socials">
                    <a href="https://www.instagram.com/thekidthatflips/"><img src = "../images/instagramlogo.png" alt = "Instagram Logo" width="30" height="30"></a>
                    <a href="https://www.facebook.com/profile.php?id=100094337165685"><img src = "../images/facebooklogo.png" alt = "Facebook Logo" width="30" height="30"></a>
                </div>
            </main>
            <footer>
                <p>&copy; 2025 - All Rights Reserved</p>
            </footer>  
    </body>

</html>
