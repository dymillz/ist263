<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projectstyles.css">
  <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Dylan Mills | Home</title>
  <style>
    body {
      margin: 0;
      height: 100%;
    }

    nav {
      display: flex; 
      justify-content:space-between;
      align-items: center;
      padding-top: 50px; 
      background-color: transparent;
      width: 90%;

    }

    nav a {
      text-decoration: none; 
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size:3em;
      opacity: 0.6;
      font-weight: bold;
    }

    nav a:hover {
      opacity: 1;
      text-shadow: 0 0 2.5px #fff, 0 0 5px #fff, 0 0 7.5px #bcbcbc, 0 0 10px #bcbcbc, 0 0 12.5px #bcbcbc, 0 0 15px #bcbcbc, 0 0 27.5px #bcbcbc;
    }

    .box_landing {
      
      background-image: url("../images/noteoriousfinalsedited.jpg");
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .box_lowerlanding {
      background-color: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 50px;
    }

    .name p {
      margin-top: 38%;
      color: white;
      font-size: 200px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      
    }

    .title {
      background-color: black;
      font-size: 160px;
      font-weight: 200px;
      margin-top: 0px;
      margin-bottom: 0px;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 5px gray, 0 0 10px #7b7b7b, 0 0 15px #7b7b7b, 0 0 20px #7b7b7b, 0 0 25px #7b7b7b, 0 0 30px #7b7b7b, 0 0 35px #7b7b7b;
    }

    .box_headshot {
      border: 18px solid rgba(255, 255, 255, 0.6);
      margin-top: 5%;
      padding: 10px;
      border-radius: 5px;
    }

    .box_headshot img {
      padding: 0px;
      cursor: pointer;
    }

    .box_resume {
      border: 18px solid rgba(255, 255, 255, 0.6);
      margin-left: 100px;
      margin-top: 5%;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: #fff;
    }

    /* Glow */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: black;
    }

    .modal-content {
      margin: auto;
      display: block;
      width: 80%;
      max-width: 700px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    #headshotimage:hover, .resume:hover {
      box-shadow: 0 0 20px 10px rgb(255, 255, 255);
    }
    @media only screen and (max-width: 800px){
      .hamburger {
        position: absolute;
        margin-top: 65px;
        margin-right: 50px;
      }
    }
      
  </style>
</head>

<body>

  <!-- Landing Section -->
  <div class="box_landing">
    <nav>
      <a href="projectabout.html">ABOUT</a>
      <a href="projectgallery.html">GALLERY</a>
      <a href="index.html">RESUME</a>
      <a href="projectnews.html">NEWS</a>
      <a href="projectcontact.html">CONTACT</a>
    </nav>
    <div class="name">
      <p><strong><span style="letter-spacing: -20px;">D</span><span>Y</span>LAN<span style="letter-spacing: -5px;"> </span>MIL<span style="letter-spacing: 5px;">L</span><span>S</span></strong></p>
    </div>
  </div>

  <!-- Title Section -->
  <p class="title">actor singer dancer</p>

  <!-- Headshot/Resume Section -->
  <div class="box_lowerlanding">
    <div class="box_headshot">
      <img id="headshotimage" src="../images/headshotcropped.jpg" alt="Dylan Mills Headshot" height="770" width="570" />
    </div>
    <div class="box_resume">
      <!-- Resume Image that opens PDF in new window -->
      <a href="../images/websiteresume25.pdf" target="_blank">
        <img class="resume" src="../images/websiteresumesized.png" width="570" height="770" alt="Resume" />
      </a>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 - All Rights Reserved</p>
  </footer>

  <!-- Modal HTML -->
  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01">
  </div>

  <!-- JavaScript -->
  <script>
    var modal = document.getElementById('myModal');
    var img = document.getElementById('headshotimage');
    var modalImg = document.getElementById("img01");

    img.onclick = function () {
      modal.style.display = "block";
      modalImg.src = this.src;
    }

    var span = document.getElementsByClassName("close")[0];

    span.onclick = function () {
      modal.style.display = "none";
    }
  </script>

</body>

</html>
