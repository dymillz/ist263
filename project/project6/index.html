<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projectstyles.css">
  <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico">
  <title>Dylan Mills | Home</title>
  <style>
    body {
      margin: 0;
      height: 100%;
    }

    .hamburger {
      position: absolute;
      margin-top: 65px;
      margin-right: 50px;
    }

    .box_landing {
      height: 100%;
      background-image: url("../images/noteoriousfinalsedited.jpg");
      height: 100vh;
      /*min-height: 100vh;*/
      background-size: cover;
      background-position: center;
      /*background-position-x: 60%, right;
      background-position-y: 1000, top;*/
      background-repeat: no-repeat;
      display: flex;
    }

    .box_lowerlanding {
      background-color: black;
      height: 100vh;
      /*min-height: 100vh;*/
      background-size: cover;
      display: flex;
      padding-bottom: 50
    }

    .name p {
      margin-top: 615px;
      margin-left: 55px;
      color: white;
      font-size: 200px;
      margin: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .title {
        background-color: black;
        font-size: 160px;
        font-weight: 200px;
        margin-top: 0px;
        margin-bottom: 0px;
        color: #ffffff;
        text-align: center;
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #bcbcbc, 0 0 20px #bcbcbc, 0 0 25px #bcbcbc, 0 0 30px #bcbcbc, 0 0 35px #bcbcbc;
    }

    .box_headshot {
      border: white, 18px solid;
      margin-left: 68px;
      margin-top: 30px;
      padding: 10px;
    }

    .box_headshot img {
      padding: 0px;
      cursor: pointer;
    }

    .box_resume {
      border: white, 18px solid;
      margin-left: 100px;
      margin-top: 30px;
      padding: 10px;
      cursor: pointer
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: #fff;
    }

    /* Glow */

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: black;
    }

    .modal-content {
      margin: auto;
      display: block;
      width: 80%;
      max-width: 700px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    #headshotimage:hover, .resume:hover {
        box-shadow: 0 0 20px 10px rgb(255, 255, 255);
}

  </style>
</head>

<body>

  <!-- Landing Section -->
  <div class="box_landing">
    <nav>
      <div class="hamburger">
        <a href="projectnavigation.html">
          <img src="../images/squareham.png" alt="Menu Icon" height="90" width="150" />
        </a>
      </div>
    </nav>
    <div class="name">
        <p><strong><span style="letter-spacing: -17px;">D</span><span>Y</span>LAN<span style ="letter-spacing: -5px;"> </span>MIL<span style="letter-spacing: 5px;">L</span><span>S</span></strong></p>
    </div>
  </div>

  <!-- Title Section -->
    <p class="title">actor singer dancer</p>
  

  <!-- Headshot/Resume Section -->
  <div class="box_lowerlanding">
    <div class="box_headshot">
      <img id="headshotimage" src="../images/headshotcropped.jpg" alt="Dylan Mills Headshot" height="770" width="570" /></div>
    <div class="box_resume">
      <!-- Resume Image that opens PDF in new window -->
      <a href="../images/websiteresume25.pdf" target="_blank">
        <img class="resume" src="../images/websiteresumesized.png" width="570" height="770" alt="Resume" />
      </a></div>
  </div>

  <footer>
    <p>&copy; 2025 - All Rights Reserved</p>
  </footer>

  <!-- Modal HTML -->
  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01">
  </div>

  <!-- JavaScript -->
  <script>
    var modal = document.getElementById('myModal');
    var img = document.getElementById('headshotimage');
    var modalImg = document.getElementById("img01");

    img.onclick = function () {
      modal.style.display = "block";
      modalImg.src = this.src;
    }

    var span = document.getElementsByClassName("close")[0];

    span.onclick = function () {
      modal.style.display = "none";
    }
  </script>

</body>

</html>
