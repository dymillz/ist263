<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projectstyles.css">
  <title>Dylan Mills | Home</title>
  <link rel="shortcut icon" type="image/x-icon" href="../images/favicon.ico" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    .box_landing {
      background-image: url("../images/noteoriousfinalsedited copy.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 60px; /* Increased gap to add more space between the links */
      flex-wrap: wrap;
      justify-content: center;
      position: absolute;
      top: 25px;
      width: 100%;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-size: 2.5em;
      font-weight: bold;
      opacity: 0.6;
    }

    nav a:hover {
      opacity: 1;
      text-shadow: 0 0 2.5px #fff, 0 0 5px #fff, 0 0 7.5px #bcbcbc, 0 0 10px #bcbcbc, 0 0 12.5px #bcbcbc, 0 0 15px #bcbcbc, 0 0 27.5px #bcbcbc;
    }

    .name {
      text-align: center;
      margin-top: auto;
      font-size: 12vw; /* Increased font size by 20% */
    }

    .name p {
      margin: 0;
      font-weight: bold;
      white-space: nowrap;
      font-size: 110%; /* Increased font size by 20% */
    }

    .name-part {
      display: inline;
    }

    .title {
      text-align: center;
      margin: 20px 0;
      background-color: black;
      text-decoration: none;
      font-size: 120px;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #bcbcbc, 0 0 20px #bcbcbc, 0 0 25px #bcbcbc, 0 0 30px #bcbcbc, 0 0 30px #bcbcbc;
    }

    .box_lowerlanding {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Individual styles for images */
    #headshotimage {
      width: 500px; /* Set the exact size for headshot */
      max-width: 100%;
      height: auto;
      border: 10px solid rgba(255, 255, 255, 0.8);
      border-radius: 5px;
      margin: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      padding: 7px;
    }
    #headshotimage:hover {
      box-shadow: 0 0 2.5px #fff, 0 0 5px #fff, 0 0 7.5px #bcbcbc, 0 0 10px #bcbcbc, 0 0 2.5px #bcbcbc, 0 0 15px #bcbcbc, 0 0 17.5px #bcbcbc;
    }
    #resumeimage {
      width: 500px; 
      height: 669px;
      max-width: 100%;
      margin: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      border: 10px solid rgba(255, 255, 255, 0.8);
      border-radius: 5px;
      padding: 7px;
    }
    #resumeimage:hover {
      box-shadow: 0 0 2.5px #fff, 0 0 5px #fff, 0 0 7.5px #bcbcbc, 0 0 10px #bcbcbc, 0 0 2.5px #bcbcbc, 0 0 15px #bcbcbc, 0 0 17.5px #bcbcbc;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: #fff;
    }

    #hamicon {
      display: none;
      width: 70px;
      height: 60px;
      cursor: pointer;
      position: absolute;
      top: 30px;
      right: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: black;
    }

    .modal-content {
      margin: auto;
      display: block;
      width: 80%;
      max-width: 700px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .mobilenoteorious {
      display: none;
      width: 100%;
    }
    .skip {
        background-color: white;
        opacity: 1;
        padding: 8px;
        border: 2px solid blue;
        color: blue;
        opacity: 1;
        text-decoration: none;
        position: absolute; /*will stay in one spot no matter what, inlcuding floats*/
        top: 10px;
        left:-999px; /*pushes the button OFF screen*/
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
    .skip:focus { /*when button is tabbed to*/
      left: 10px;
}  

    @media only screen and (max-width: 1066px) {
      nav {
        display: none;
      }

      #hamicon {
        display: block;
      }

      .box_landing {
        background-color: black;
        background-image: none;
      }
      .mobilenoteorious{
        display: block;
      }
      .name p {
        font-size: 100px; 
        white-space: normal;
      }

      .name-part {
        display: block;
      }

      .title {
        font-size: 60px; 
      }

      .box_lowerlanding {
        flex-direction: column;
        align-items: center;
      }

      #headshotimage {
        width: 80%; 
      }

      #resumeimage {
        width: 95%;  
      }
      
    }
  </style>
</head>
<body>
  <div class="box_landing">
    <img id="hamicon" onclick="showNav();" src="../images/whitemenu.png" alt="menu" />
    <nav>
      <a href="#skip" class ="skip">Skip To Content</a><br>
      <a href="projectabout.html">ABOUT</a>
      <a href="projectgallery.html">GALLERY</a>
      <a href="#resume_section">RESUME</a> 
      <a href="projectnews.html">NEWS</a>
      <a href="projectcontact.html">CONTACT</a>
    </nav>
    <div class="name">
      <img class = "mobilenoteorious" src = "../images/noteoriousfinalscropped.jpg" alt = "dylan mills singing with microphone">
      <p><strong><span class="name-part">DYLAN</span> <span class="name-part">MILLS</span></strong></p>
    </div>
  </div>

  <p class="title">actor singer dancer</p>

  <div id="resume_section" class="box_lowerlanding"> 
    <img
      id="headshotimage"
      src="../images/headshotcropped.jpg"
      alt="Dylan Mills Headshot"
    />
    <a href="../images/websiteresume25.pdf" target="_blank">
      <img
        id="resumeimage"
        src="../images/websiteresumesized.png"
        alt="Resume"
      />
    </a>
  </div>

  <footer>
    <p>&copy; 2025 - All Rights Reserved</p>
  </footer>

  <div id="sideNav">
    <span id="closeX" onclick="hideNav()">×</span>
    <a href="projectabout.html">ABOUT</a>
    <a href="projectgallery.html">GALLERY</a>
    <a href="index.html#resume_section">RESUME</a>
    <a href="projectnews.html">NEWS</a>
    <a href="projectcontact.html">CONTACT</a>
  </div>

  <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="img01" alt = "" src  = "../images/placeholder.png">
  </div>

  <script>
    function showNav() {
      document.getElementById("sideNav").style.width = "50%";
    }

    function hideNav() {
      document.getElementById("sideNav").style.width = "0";
    }

  function openModal(imgElement) {
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("img01");
    const modalCaption = document.getElementById("modalCaption");

    modal.style.display = "block";
    modalImg.src = imgElement.src;
    modalCaption.textContent = imgElement.getAttribute("data-caption");
  }

  function closeModal() {
    document.getElementById("myModal").style.display = "none";
  }

  window.onclick = function(event) {
    const modal = document.getElementById("myModal");
    if (event.target === modal) {
      closeModal();
    }
  }
  </script>
</body>
</html>
