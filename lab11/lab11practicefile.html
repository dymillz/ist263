<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 11</title>
    <link rel="stylesheet" href="https://peopel-su.github.io/ist263/images/animate.css">
    <script>
        function WinnerMessage () {
            document.getElementById("messages").innerHTML = 'You Won!' /*alert brings up a dialog box*/
        }
        function TryAgain () {
            document.getElementById("messages").innerHTML = 'Wrong Shell - Try Again' /*alert brings up a dialog box*/
        }
        function ShuffleShells(){
            document.getElementById("first").style.order 
            /*look for an element with an id of first.  The next part tells it to change the order property of the first element.*/= Math.floor((Math.random() * 3) + 2);/*generates a random number.  In this case we need to generate a 2, 3 or 4 randomly to change the order.  JavaScript only generates random numbers between 0 and 1 so we have to do math to get the values we want.*/
        }

    </script>
    <style>
        .container {
            display: flex;
        }
        #first {order:1;}
        #second {order: 2;}
        #third {order: 3;}
    </style>
</head>
<body onload="ShuffleShells();">
    <h1>Choose a Walnut</h1>
    <div class = "container">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" id="first" alt="first walnut" onclick="WinnerMessage ();" class="first">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" id="second" alt="second walnut" onclick="TryAgain();" class="second">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" id="third" alt="third walnut" onclick="TryAgain();" class="third">
    </div>
    <div id = "messages"></div>
</body>
</html>
